<div class="auth-contenedor">
  <!-- Botón Volver -->
  <div class="auth-header">
    <a routerLink="/" class="btn-volver">← VOLVER A LA TIENDA</a>
    <h1 class="logo-tienda">BYTINAKT</h1>
  </div>

  <div class="auth-card">
    <h2>{{ esModoLogin ? 'INICIAR SESIÓN' : 'CREAR CUENTA' }}</h2>
    <p class="auth-subtitulo">
      {{ esModoLogin ? 'Ingresá a tu cuenta de ByTinakt' : 'Completá tus datos para registrarte' }}
    </p>

    <form (ngSubmit)="onSubmit()" #authForm="ngForm">
      <!-- Nombre (solo en Registro) -->
      <div class="campo-grupo" *ngIf="!esModoLogin">
        <label for="nombre">Nombre completo</label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          [(ngModel)]="nombre" 
          placeholder="Tu nombre" 
          required 
        />
      </div>

      <!-- Email -->
      <div class="campo-grupo">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="ejemplo@correo.com" 
          required 
        />
      </div>

      <!-- Contraseña -->
      <div class="campo-grupo">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <button type="submit" class="btn-submit">
        {{ esModoLogin ? 'INGRESAR' : 'REGISTRARME' }}
      </button>
    </form>

    <div class="auth-footer">
      <p *ngIf="esModoLogin">
        ¿No tenés cuenta? 
        <button type="button" class="btn-link" (click)="toggleModo()">Registrate acá</button>
      </p>
      <p *ngIf="!esModoLogin">
        ¿Ya tenés cuenta? 
        <button type="button" class="btn-link" (click)="toggleModo()">Iniciá sesión</button>
      </p>
    </div>
  </div>
</div>
