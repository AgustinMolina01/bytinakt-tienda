<div class="auth-container">
  <h2>{{ isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión' }}</h2>
  
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Correo Electrónico:</label>
      <input type="email" [(ngModel)]="email" name="email" required placeholder="correo@ejemplo.com">
    </div>

    <div class="form-group">
      <label>Contraseña:</label>
      <input type="password" [(ngModel)]="password" name="password" required placeholder="********">
    </div>

    <button type="submit" class="btn-submit">
      {{ isRegisterMode ? 'Registrarse' : 'Ingresar' }}
    </button>
  </form>

  <p (click)="toggleMode()" class="toggle-link">
    {{ isRegisterMode ? '¿Ya tenés cuenta? Iniciá sesión' : '¿No tenés cuenta? Registrate' }}
  </p>
</div>
