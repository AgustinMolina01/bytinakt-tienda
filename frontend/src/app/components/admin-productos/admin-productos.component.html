<div class="admin-container">
  <h2>Panel de Administración - Bytinakt</h2>

  <!-- Formulario para agregar producto -->
  <form (ngSubmit)="agregarProducto()" class="form-producto">
    <h3>Agregar Nuevo Producto</h3>
    
    <div class="form-group">
      <label>Nombre:</label>
      <input type="text" [(ngModel)]="nuevoProducto.nombre" name="nombre" required placeholder="Ej: Remera Oversize">
    </div>

    <div class="form-group">
      <label>Precio ($):</label>
      <input type="number" [(ngModel)]="nuevoProducto.precio" name="precio" required placeholder="25000">
    </div>

    <div class="form-group">
      <label>Categoría:</label>
      <select [(ngModel)]="nuevoProducto.categoria" name="categoria" required>
        <option value="">Seleccionar categoría</option>
        <option *ngFor="let cat of categoriasDisponibles" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Talle:</label>
      <input type="text" [(ngModel)]="nuevoProducto.talle" name="talle" placeholder="Ej: S, M, L, XL">
    </div>

    <div class="form-group">
      <label>Imagen de la prenda:</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*">
    </div>

    <button type="submit" class="btn-guardar">Guardar Producto</button>
  </form>

  <hr class="divider">

  <!-- Listado y Filtros -->
  <div class="listado-seccion">
    <h3>Inventario de Productos</h3>

    <!-- Botones de categorías fijas para filtrar la vista -->
    <div class="botones-categorias-filtro">
      <button 
        type="button" 
        class="btn-filtro" 
        [class.activo]="categoriaSeleccionada === 'TODAS'" 
        (click)="filtrarCategoria('TODAS')">
        TODAS
      </button>
      
      <button 
        type="button" 
        class="btn-filtro" 
        *ngFor="let cat of categoriasDisponibles" 
        [class.activo]="categoriaSeleccionada === cat" 
        (click)="filtrarCategoria(cat)">
        {{ cat }}
      </button>
    </div>

    <!-- Grilla de productos filtrados -->
    <div class="productos-grid">
      <div *ngFor="let producto of productosFiltrados()" class="producto-card">
        <img [src]="producto.imagenUrl || 'https://via.placeholder.com/300'" [alt]="producto.nombre">
        <div class="producto-info">
          <h4>{{ producto.nombre }}</h4>
          <p class="precio">${{ producto.precio }}</p>
          <p class="detalle">
            {{ producto.categoria }} 
            <span *ngIf="producto.talle">• Talle {{ producto.talle }}</span>
          </p>
          <button type="button" class="btn-eliminar" (click)="eliminarProducto(producto)">Eliminar</button>
        </div>
      </div>
    </div>

<!-- SECCIÓN DE GESTIÓN DE BANNERS -->
<div class="seccion-admin-banner" style="margin-top: 40px; background: #ebe4db; padding: 25px; border-radius: 8px; border: 1px solid #d5cec5;">
  <h3 style="font-family: 'Playfair Display', serif; color: #803A3A; margin-top: 0;">Gestión de Carrusel / Banner Principal</h3>
  
  <div style="margin-bottom: 20px;">
    <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 13px;">
      Seleccionar nueva imagen desde tu equipo:
    </label>
    <input 
      type="file" 
      accept="image/*" 
      (change)="onBannerSelected($event)" 
      style="padding: 8px; background: white; border-radius: 4px; border: 1px solid #ccc; width: 100%; cursor: pointer;" 
    />
  </div>

  <div class="lista-banners">
    <div *ngFor="let img of imagenesBanner; let i = index" style="display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 15px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #e0e0e0;">
      <!-- Muestra una miniatura de la imagen -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <img [src]="img" alt="Banner {{i}}" style="width: 80px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd;" />
        <span style="font-size: 12px; color: #666;">Imagen {{ i + 1 }}</span>
      </div>
      <button (click)="eliminarBanner(i)" style="background-color: #c94a4a; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">
        Eliminar
      </button>
    </div>
  </div>
</div>

  </div>
</div>
