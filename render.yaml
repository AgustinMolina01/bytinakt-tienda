services:
  - type: web
    name: bytinakt-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Dominio de la tienda en Vercel (si hay varios, separalos con coma).
      - key: FRONTEND_URL
        value: https://bytinakt-tienda.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Acceso de administración independiente de MongoDB (opcional).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Mercado Pago.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_NOTIFICATION_URL
        sync: false
      # Transferencia bancaria (datos públicos que ve el cliente).
      - key: BANK_TRANSFER_BANK
        sync: false
      - key: BANK_TRANSFER_ALIAS
        sync: false
      - key: BANK_TRANSFER_CBU
        sync: false
      - key: BANK_ACCOUNT_HOLDER
        sync: false
      - key: TRANSFER_DISCOUNT_PERCENT
        value: "20"
      # Envío a domicilio y retiro en el local.
      - key: SHIPPING_FLAT_RATE
        sync: false
      - key: LOCAL_PICKUP_ADDRESS
        value: San Martín 4175, Mar del Plata
      - key: LOCAL_PICKUP_POSTAL_CODE
        value: "7600"
